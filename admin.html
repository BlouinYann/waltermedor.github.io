<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — StagePanel</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../scripts.js" defer></script>
  <style>
    .dup-warning {
      border: 1px solid #c2ad86;
      border-left: 5px solid #d9a441;
      background: rgba(217, 164, 65, 0.12);
      border-radius: 6px;
      padding: 14px 16px;
    }
    .dup-warning p { margin: 0 0 8px; }
    .dup-title { font-weight: bold; color: #e8c375; }
    .dup-list { margin: 0 0 10px; padding-left: 20px; }
    .dup-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .dup-actions .btn { flex: 1 1 220px; }
  </style>
</head>

<body class="admin-page">
  
  <div class="loading-gate" id="loadingGate">Vérification de la session…</div>

  <div class="admin-wrap" id="appWrap" style="display:none;">
    <header class="admin-topbar">
      <h1>StagePanel — Admin</h1>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="admin-who" id="whoami"></span>
        <button class="btn btn-ghost" id="logoutBtn">Se déconnecter</button>
      </div>
    </header>

    <section class="admin-card">
      <h2 id="formTitle">Ajouter une date de concert</h2>
      <form class="concert-form" id="concertForm">
        <input type="hidden" id="concertId">
        <div class="auth-field">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <div class="auth-field city-autocomplete-wrap">
          <label for="ville">Ville</label>
          <input type="text" id="ville" placeholder="Commence à taper..." autocomplete="off" required>
          <input type="hidden" id="codeInsee">
          <input type="hidden" id="latitude">
          <input type="hidden" id="longitude">
          <ul class="city-suggestions" id="citySuggestions" hidden></ul>
        </div>
        <div class="auth-field">
          <label for="codePostal">Code postal</label>
          <select id="codePostal" required>
            <option value="" disabled selected>Choisis d'abord une ville</option>
          </select>
        </div>
        <div class="auth-field full">
          <label for="salle">Salle</label>
          <input type="text" id="salle" placeholder="Le Ferrailleur">
        </div>
        <div class="auth-field">
          <label for="lien">Lien billetterie</label>
          <input type="url" id="lien" placeholder="https://...">
        </div>
        <div class="field-check">
          <input type="checkbox" id="publie" checked>
          <label for="publie">Visible sur le site public</label>
        </div>
        <div class="full dup-warning" id="dupWarning" hidden>
          <p class="dup-title">Attention : un concert est déjà enregistré à cette date</p>
          <ul class="dup-list" id="dupList"></ul>
          <p>Est-ce le même évènement ?</p>
          <div class="dup-actions">
            <button type="button" class="btn btn-gold" id="dupConfirmBtn">Non, autre évènement : enregistrer</button>
            <button type="button" class="btn btn-ghost" id="dupCancelBtn">Oui, même évènement : ne pas enregistrer</button>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-gold" id="saveBtn">Enregistrer</button>
          <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Annuler</button>
        </div>
      </form>
    </section>

    <section class="admin-card">
      <h2>Dates de concert</h2>
      <table class="admin-table">
        <thead>
          <tr><th>Date</th><th>Ville</th><th>CP</th><th>Salle</th><th>Statut</th><th></th></tr>
        </thead>
        <tbody id="concertRows"></tbody>
      </table>
      <div class="admin-empty" id="emptyState" style="display:none;">Aucune date pour le moment.</div>
    </section>
  </div>

  <script type="module">
    import {
      auth, db, onAuthStateChanged, signOut,
      collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy
    } from './firebase-init.js';

    const loadingGate = document.getElementById('loadingGate');
    const appWrap = document.getElementById('appWrap');
    const whoami = document.getElementById('whoami');

    // Garde d'authentification : redirige si non connecté
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      whoami.textContent = user.email;
      loadingGate.style.display = 'none';
      appWrap.style.display = 'block';
      startListening();
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    });

    // --- Gestion du formulaire ---
    const form = document.getElementById('concertForm');
    const formTitle = document.getElementById('formTitle');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const concertsCol = collection(db, 'concerts');
    let pendingSave = null; // enregistrement en attente de confirmation (doublon)
    let allConcerts = []; // mis à jour en temps réel, sert à détecter les doublons de date

    function resetForm() {
      hideDupWarning();
      form.reset();
      document.getElementById('concertId').value = '';
      document.getElementById('codeInsee').value = '';
      document.getElementById('latitude').value = '';
      document.getElementById('longitude').value = '';
      document.getElementById('publie').checked = true;
      resetCodePostalSelect();
      formTitle.textContent = 'Ajouter une date de concert';
      cancelEditBtn.style.display = 'none';
    }

    cancelEditBtn.addEventListener('click', resetForm);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('concertId').value;
      const data = {
        date: document.getElementById('date').value,
        ville: document.getElementById('ville').value.trim(),
        codePostal: document.getElementById('codePostal').value,
        codeInsee: document.getElementById('codeInsee').value,
        latitude: document.getElementById('latitude').value ? parseFloat(document.getElementById('latitude').value) : null,
        longitude: document.getElementById('longitude').value ? parseFloat(document.getElementById('longitude').value) : null,
        salle: document.getElementById('salle').value.trim(),
        lien: document.getElementById('lien').value.trim(),
        publie: document.getElementById('publie').checked
      };
      // Doublon : un autre concert existe déjà à cette date ?
      const doublons = allConcerts.filter((c) => c.date === data.date && c.id !== id);
      if (doublons.length) {
        pendingSave = { id, data };
        showDupWarning(doublons);
        return;
      }
      await saveConcert(id, data);
    });

    async function saveConcert(id, data) {
      if (id) {
        await updateDoc(doc(db, 'concerts', id), data);
      } else {
        await addDoc(concertsCol, data);
      }
      resetForm();
    }

    // --- Avertissement doublon : affiché dans la page (pas de pop-up) ---
    const dupWarning = document.getElementById('dupWarning');
    const dupList = document.getElementById('dupList');

    function showDupWarning(doublons) {
      dupList.innerHTML = '';
      doublons.forEach((c) => {
        const li = document.createElement('li');
        li.textContent = `${formatDate(c.date)} — ${c.ville || '?'}${c.salle ? ' (' + c.salle + ')' : ''}`;
        dupList.appendChild(li);
      });
      dupWarning.hidden = false;
      dupWarning.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function hideDupWarning() {
      pendingSave = null;
      dupWarning.hidden = true;
    }

    document.getElementById('dupConfirmBtn').addEventListener('click', async () => {
      if (!pendingSave) return;
      const { id, data } = pendingSave;
      dupWarning.hidden = true;
      pendingSave = null;
      await saveConcert(id, data);
    });

    document.getElementById('dupCancelBtn').addEventListener('click', hideDupWarning);

    // Si la date change, l'avertissement n'a plus lieu d'être
    document.getElementById('date').addEventListener('input', hideDupWarning);

    function editConcert(c) {
      document.getElementById('concertId').value = c.id;
      document.getElementById('date').value = c.date || '';
      document.getElementById('ville').value = c.ville || '';
      document.getElementById('codeInsee').value = c.codeInsee || '';
      document.getElementById('latitude').value = c.latitude != null ? c.latitude : '';
      document.getElementById('longitude').value = c.longitude != null ? c.longitude : '';
      document.getElementById('salle').value = c.salle || '';
      document.getElementById('lien').value = c.lien || '';
      document.getElementById('publie').checked = !!c.publie;

      // Reconstruit l'option du code postal existant (même si on n'a pas
      // re-interrogé l'API, on garde au moins la valeur déjà enregistrée)
      resetCodePostalSelect();
      if (c.codePostal) {
        const select = document.getElementById('codePostal');
        select.innerHTML = `<option value="${c.codePostal}" selected>${c.codePostal}</option>`;
      }

      formTitle.textContent = 'Modifier la date';
      cancelEditBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- Autocomplétion des villes (API geo.api.gouv.fr, gratuite, sans clé) ---
    const villeInput = document.getElementById('ville');
    const suggestionsList = document.getElementById('citySuggestions');
    const codePostalSelect = document.getElementById('codePostal');
    let debounceTimer = null;

    function resetCodePostalSelect() {
      codePostalSelect.innerHTML = '<option value="" disabled selected>Choisis d\'abord une ville</option>';
    }

    villeInput.addEventListener('input', () => {
      const value = villeInput.value.trim();
      document.getElementById('codeInsee').value = '';
      resetCodePostalSelect();

      clearTimeout(debounceTimer);
      if (value.length < 2) {
        suggestionsList.hidden = true;
        suggestionsList.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const url = `https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(value)}&fields=nom,code,codesPostaux,centre&boost=population&limit=10`;
          const res = await fetch(url);
          const communes = await res.json();
          renderSuggestions(communes);
        } catch (err) {
          suggestionsList.hidden = true;
        }
      }, 300);
    });

    function renderSuggestions(communes) {
      suggestionsList.innerHTML = '';
      if (!communes.length) {
        suggestionsList.hidden = true;
        return;
      }
      communes.forEach((commune) => {
        const li = document.createElement('li');
        li.textContent = `${commune.nom} (${commune.codesPostaux.join(', ')})`;
        li.addEventListener('click', () => selectCommune(commune));
        suggestionsList.appendChild(li);
      });
      suggestionsList.hidden = false;
    }

    function selectCommune(commune) {
      villeInput.value = commune.nom;
      document.getElementById('codeInsee').value = commune.code;
      if (commune.centre && commune.centre.coordinates) {
        document.getElementById('longitude').value = commune.centre.coordinates[0];
        document.getElementById('latitude').value = commune.centre.coordinates[1];
      }
      suggestionsList.hidden = true;
      suggestionsList.innerHTML = '';

      codePostalSelect.innerHTML = '';
      commune.codesPostaux.forEach((cp, i) => {
        const opt = document.createElement('option');
        opt.value = cp;
        opt.textContent = cp;
        if (i === 0) opt.selected = true;
        codePostalSelect.appendChild(opt);
      });
    }

    // Ferme la liste si on clique ailleurs
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.city-autocomplete-wrap')) {
        suggestionsList.hidden = true;
      }
    });

    async function deleteConcert(id) {
      if (!confirm('Supprimer définitivement cette date ?')) return;
      await deleteDoc(doc(db, 'concerts', id));
    }

    // --- Liste en temps réel ---
    function startListening() {
      const q = query(concertsCol, orderBy('date', 'desc'));
      onSnapshot(q, (snapshot) => {
        allConcerts = snapshot.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .sort((x, y) => (y.date || '').localeCompare(x.date || '')); // plus récente en haut
        const rows = document.getElementById('concertRows');
        const emptyState = document.getElementById('emptyState');
        rows.innerHTML = '';

        if (snapshot.empty) {
          emptyState.style.display = 'block';
          return;
        }
        emptyState.style.display = 'none';

        allConcerts.forEach((c) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${formatDate(c.date)}</td>
            <td>${escapeHtml(c.ville || '')}</td>
            <td>${escapeHtml(c.codePostal || '')}</td>
            <td>${escapeHtml(c.salle || '')}</td>
            <td><span class="badge ${c.publie ? 'badge-live' : 'badge-draft'}">${c.publie ? 'Publié' : 'Brouillon'}</span></td>
            <td class="actions">
              <button class="btn btn-ghost btn-sm" data-action="edit">Modifier</button>
              <button class="btn btn-danger btn-sm" data-action="delete">Supprimer</button>
            </td>
          `;
          tr.querySelector('[data-action="edit"]').addEventListener('click', () => editConcert(c));
          tr.querySelector('[data-action="delete"]').addEventListener('click', () => deleteConcert(c.id));
          rows.appendChild(tr);
        });
      });
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
