<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — StagePanel</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-page">
  <div class="loading-gate" id="loadingGate">Vérification de la session…</div>

  <div class="admin-wrap" id="appWrap" style="display:none;">
    <header class="admin-topbar">
      <h1>StagePanel — Admin</h1>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="admin-who" id="whoami"></span>
        <button class="btn btn-ghost" id="logoutBtn">Se déconnecter</button>
      </div>
    </header>

    <section class="admin-card">
      <h2 id="formTitle">Ajouter une date de concert</h2>
      <form class="concert-form" id="concertForm">
        <input type="hidden" id="concertId">
        <div class="auth-field">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <div class="auth-field">
          <label for="ville">Ville</label>
          <input type="text" id="ville" placeholder="Nantes" required>
        </div>
        <div class="auth-field">
          <label for="salle">Salle</label>
          <input type="text" id="salle" placeholder="Le Ferrailleur">
        </div>
        <div class="auth-field">
          <label for="lien">Lien billetterie</label>
          <input type="url" id="lien" placeholder="https://...">
        </div>
        <div class="field-check">
          <input type="checkbox" id="publie" checked>
          <label for="publie">Visible sur le site public</label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-gold" id="saveBtn">Enregistrer</button>
          <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Annuler</button>
        </div>
      </form>
    </section>

    <section class="admin-card">
      <h2>Dates de concert</h2>
      <table class="admin-table">
        <thead>
          <tr><th>Date</th><th>Ville</th><th>Salle</th><th>Statut</th><th></th></tr>
        </thead>
        <tbody id="concertRows"></tbody>
      </table>
      <div class="admin-empty" id="emptyState" style="display:none;">Aucune date pour le moment.</div>
    </section>
  </div>

  <script type="module">
    import {
      auth, db, onAuthStateChanged, signOut,
      collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy
    } from './firebase-init.js';

    const loadingGate = document.getElementById('loadingGate');
    const appWrap = document.getElementById('appWrap');
    const whoami = document.getElementById('whoami');

    // Garde d'authentification : redirige si non connecté
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      whoami.textContent = user.email;
      loadingGate.style.display = 'none';
      appWrap.style.display = 'block';
      startListening();
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    });

    // --- Gestion du formulaire ---
    const form = document.getElementById('concertForm');
    const formTitle = document.getElementById('formTitle');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const concertsCol = collection(db, 'concerts');

    function resetForm() {
      form.reset();
      document.getElementById('concertId').value = '';
      document.getElementById('publie').checked = true;
      formTitle.textContent = 'Ajouter une date de concert';
      cancelEditBtn.style.display = 'none';
    }

    cancelEditBtn.addEventListener('click', resetForm);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('concertId').value;
      const data = {
        date: document.getElementById('date').value,
        ville: document.getElementById('ville').value.trim(),
        salle: document.getElementById('salle').value.trim(),
        lien: document.getElementById('lien').value.trim(),
        publie: document.getElementById('publie').checked
      };
      if (id) {
        await updateDoc(doc(db, 'concerts', id), data);
      } else {
        await addDoc(concertsCol, data);
      }
      resetForm();
    });

    function editConcert(c) {
      document.getElementById('concertId').value = c.id;
      document.getElementById('date').value = c.date || '';
      document.getElementById('ville').value = c.ville || '';
      document.getElementById('salle').value = c.salle || '';
      document.getElementById('lien').value = c.lien || '';
      document.getElementById('publie').checked = !!c.publie;
      formTitle.textContent = 'Modifier la date';
      cancelEditBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteConcert(id) {
      if (!confirm('Supprimer définitivement cette date ?')) return;
      await deleteDoc(doc(db, 'concerts', id));
    }

    // --- Liste en temps réel ---
    function startListening() {
      const q = query(concertsCol, orderBy('date', 'asc'));
      onSnapshot(q, (snapshot) => {
        const rows = document.getElementById('concertRows');
        const emptyState = document.getElementById('emptyState');
        rows.innerHTML = '';

        if (snapshot.empty) {
          emptyState.style.display = 'block';
          return;
        }
        emptyState.style.display = 'none';

        snapshot.forEach((docSnap) => {
          const c = { id: docSnap.id, ...docSnap.data() };
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${formatDate(c.date)}</td>
            <td>${escapeHtml(c.ville || '')}</td>
            <td>${escapeHtml(c.salle || '')}</td>
            <td><span class="badge ${c.publie ? 'badge-live' : 'badge-draft'}">${c.publie ? 'Publié' : 'Brouillon'}</span></td>
            <td class="actions">
              <button class="btn btn-ghost btn-sm" data-action="edit">Modifier</button>
              <button class="btn btn-danger btn-sm" data-action="delete">Supprimer</button>
            </td>
          `;
          tr.querySelector('[data-action="edit"]').addEventListener('click', () => editConcert(c));
          tr.querySelector('[data-action="delete"]').addEventListener('click', () => deleteConcert(c.id));
          rows.appendChild(tr);
        });
      });
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
